name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/ai-adventure-importer/src/**'
      - 'apps/ai-adventure-importer/templates/**'
      - 'apps/ai-adventure-importer/lang/**'
      - 'apps/ai-adventure-importer/styles/**'
      - 'apps/ai-adventure-importer/module.json'
      - 'packages/bundle-schema/src/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # Use 22 — 20 is being deprecated on runners

      - name: Install dependencies
        run: npm install       # No cache — we have no lock file committed

      - name: Build bundle-schema
        run: npx tsc --project packages/bundle-schema/tsconfig.json

      - name: Build importer module
        run: |
          cd apps/ai-adventure-importer
          npm run build

      - name: Verify build output
        run: |
          echo "module.js size: $(wc -c < apps/ai-adventure-importer/module.js) bytes"
          echo "getDocumentClass count: $(grep -c getDocumentClass apps/ai-adventure-importer/module.js)"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          MODULE_PATH="${{ secrets.SSH_MODULE_PATH }}"
          USER="${{ secrets.SSH_USER }}"
          HOST="${{ secrets.SSH_HOST }}"

          scp -i ~/.ssh/deploy_key \
            apps/ai-adventure-importer/module.js \
            apps/ai-adventure-importer/module.js.map \
            apps/ai-adventure-importer/ai-adventure-importer.css \
            apps/ai-adventure-importer/module.json \
            ${USER}@${HOST}:${MODULE_PATH}/

          scp -i ~/.ssh/deploy_key \
            apps/ai-adventure-importer/lang/en.json \
            ${USER}@${HOST}:${MODULE_PATH}/lang/

          scp -i ~/.ssh/deploy_key \
            apps/ai-adventure-importer/templates/importer-app.hbs \
            apps/ai-adventure-importer/templates/review-step.hbs \
            apps/ai-adventure-importer/templates/build-step.hbs \
            ${USER}@${HOST}:${MODULE_PATH}/templates/

      - name: Restart Foundry
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'pm2 restart foundry && echo "✓ Foundry restarted"'

      - name: Verify deployment
        run: |
          COUNT=$(ssh -i ~/.ssh/deploy_key \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "grep -c getDocumentClass ${{ secrets.SSH_MODULE_PATH }}/module.js")
          echo "getDocumentClass on server: ${COUNT}"
          if [ "$COUNT" -lt "5" ]; then
            echo "ERROR: wrong file deployed"
            exit 1
          fi
          echo "✓ Deployment verified"
